<svg xmlns="http://www.w3.org/2000/svg" viewBox="-420 -420 840 840" width="840" height="840"><title>Luther Rose</title><desc>Luther Rose drawn for the Luther Aloud channel: a black cross on a red heart, on a five-petalled white rose, on a sky-blue field, within a gold ring. Original vector artwork; the arrangement follows the public-domain heraldic device described by Luther in 1530 and is not traced from any copyrighted rendering.</desc><rect x="-420" y="-420" width="840" height="840" fill="none"/><circle cx="0" cy="0" r="392" fill="none" stroke="#D8B045" stroke-width="26"/><circle cx="0" cy="0" r="366" fill="#7FA8CE"/><path d="M0 -300 C 118 -262 150 -150 92 -58 C 62 -12 26 8 0 14 C -26 8 -62 -12 -92 -58 C -150 -150 -118 -262 0 -300 Z" fill="#FFFFFF" stroke="#C9CBD0" stroke-width="6" transform="rotate(0)"/><path d="M0 -300 C 118 -262 150 -150 92 -58 C 62 -12 26 8 0 14 C -26 8 -62 -12 -92 -58 C -150 -150 -118 -262 0 -300 Z" fill="#FFFFFF" stroke="#C9CBD0" stroke-width="6" transform="rotate(72)"/><path d="M0 -300 C 118 -262 150 -150 92 -58 C 62 -12 26 8 0 14 C -26 8 -62 -12 -92 -58 C -150 -150 -118 -262 0 -300 Z" fill="#FFFFFF" stroke="#C9CBD0" stroke-width="6" transform="rotate(144)"/><path d="M0 -300 C 118 -262 150 -150 92 -58 C 62 -12 26 8 0 14 C -26 8 -62 -12 -92 -58 C -150 -150 -118 -262 0 -300 Z" fill="#FFFFFF" stroke="#C9CBD0" stroke-width="6" transform="rotate(216)"/><path d="M0 -300 C 118 -262 150 -150 92 -58 C 62 -12 26 8 0 14 C -26 8 -62 -12 -92 -58 C -150 -150 -118 -262 0 -300 Z" fill="#FFFFFF" stroke="#C9CBD0" stroke-width="6" transform="rotate(288)"/><path d="M0 132 C -104 40 -150 -46 -92 -104 C -50 -146 -14 -120 0 -86 C 14 -120 50 -146 92 -104 C 150 -46 104 40 0 132 Z" fill="#C4262E" stroke="#8C1620" stroke-width="6"/><rect x="-13" y="-96" width="26" height="176" fill="#111111"/><rect x="-62" y="-46" width="124" height="26" fill="#111111"/></svg>